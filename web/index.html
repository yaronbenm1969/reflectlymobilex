<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RILIO — Shared Stories</title>
  <meta name="description" content="RILIO — Create shared video stories with friends and family." />
  <link rel="canonical" href="https://rilio.io/" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f3ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #8B5CF6, #6D28D9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }
    .tagline {
      font-size: 18px;
      color: #6b7280;
      margin-bottom: 40px;
      max-width: 320px;
    }
    .badge {
      display: inline-block;
      background: #8B5CF6;
      color: white;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      font-size: 14px;
      color: #8B5CF6;
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="logo">RILIO</div>
  <p class="tagline">Create shared video stories with the people who matter.</p>
  <span class="badge">Coming Soon on the App Store</span>
  <nav class="links">
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Use</a>
    <a href="/support">Support</a>
  </nav>
</body>
</html>
